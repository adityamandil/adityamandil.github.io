<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Directory Section - Clean Version</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- AI Directory Section CSS -->
    <link rel="stylesheet" href="ai-directory-section.css">
</head>
<body>
    
    <!-- AI Directory Section -->
    <section class="ai-directory" id="ai-directory">
        <div class="container">
            <!-- Section Header -->
            <div class="section-header">
                <span class="section-tag">AI Discovery</span>
                <h2 class="section-title">Explore 150+ AI Tools</h2>
                <p class="section-description">
                    Discover AI solutions for every business need. Browse our curated collection 
                    of AI tools across 30+ categories - from presentations to 3D design.
                </p>
            </div>
            
            <!-- Quick Search Section -->
            <div class="ai-directory-search-container">
                <form action="search-all-ai-tools" method="GET" class="ai-directory-form">
                    <div class="ai-search-form-wrapper">
                        <!-- Search Input -->
                        <div class="ai-search-input-container">
                            <svg class="ai-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input 
                                type="text" 
                                name="search"
                                class="ai-quick-search-input"
                                placeholder="Quick search: presentations, chatbot, video editing, design..." 
                                aria-label="Search AI tools"
                            >
                        </div>
                        
                        <!-- Search Button -->
                        <button type="submit" class="ai-search-button" aria-label="Search">
                            Search
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </form>
                
                <!-- Info Text & Browse Link -->
                <div class="ai-info-section">
                    <p class="ai-info-text">
                        150+ AI tools • 30+ categories • Free to explore
                    </p>
                    <a href="search-all-ai-tools" class="ai-browse-link">
                        Or browse all AI tools →
                    </a>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
